version: 2
builds:
  - main: .
    binary: goccc
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

brews:
  - repository:
      owner: backstabslash
      name: homebrew-tap
    homepage: https://github.com/backstabslash/goccc
    description: "Fast, zero-dependency CLI cost calculator and statusline for Claude Code"
    license: MIT
    install: |
      bin.install "goccc"
    test: |
      system bin/"goccc", "-version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
